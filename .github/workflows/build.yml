name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protokoll_Null_Tagebuch_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-apk
          name: "Protokoll 0 - Android APK Release"
          body: |
            ### Protokoll 0 - Digitales Tagebuch (APK)
            Automatisch gebaut via GitHub Actions.
            
            **Installation auf dem Motorola 13 / Android:**
            1. Lade `app-debug.apk` direkt auf dein Smartphone herunter.
            2. Öffne die Datei mit dem Paket-Installer (ggf. "Unbekannte Apps installieren" erlauben).
            3. Google Play Protect Verifizierung bestätigen und App starten.
          files: app/build/outputs/apk/debug/app-debug.apk
